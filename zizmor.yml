# release.yml is generated by cargo-dist and never hand-edited; its
# findings are accepted here, scoped to that one file.
rules:
  unpinned-uses:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
