[tools]
node = "24.22.1"
"npm:markdownlint-cli2" = "0.24.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"

# The coverage gate, run by CI and by hand. Test code lives in `tests.rs`
# files, which the filter leaves out. Replace the filter with
# `#[coverage(off)]` once that attribute is stable.
[tasks.coverage]
run = "cargo llvm-cov --locked --ignore-filename-regex 'tests\\.rs$' --fail-under-lines 100"
