[tools]
node = "24.22.1"
"npm:markdownlint-cli2" = "0.24.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"

# The coverage gate, run by CI and by hand. Every production function must be
# fully covered by one test run; the xtask checker enforces it on the export.
[tasks.coverage]
run = "mkdir -p target/llvm-cov && cargo llvm-cov --locked --ignore-filename-regex 'tests\\.rs$' --json --output-path target/llvm-cov/coverage.json && cargo run --locked -p xtask -- target/llvm-cov/coverage.json"
