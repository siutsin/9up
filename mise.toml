[tools]
node = "24.22.1"
"npm:markdownlint-cli2" = "0.24.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"

# The coverage gate, run by CI and by hand. Production code must sit at
# 100 percent regions and functions; test files are filtered out by name.
[tasks.coverage]
run = "cargo llvm-cov --locked --ignore-filename-regex 'tests\\.rs$' --fail-under-regions 100 --fail-under-functions 100"
