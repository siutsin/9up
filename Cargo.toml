[workspace]
members = [".", "xtask"]
# Both, so a plain `cargo test` or `cargo clippy` at the root covers the checker too.
default-members = [".", "xtask"]

[package]
name = "nine-up"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "9up"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
glob = "=0.3.4"
walkdir = "=2.5.0"
dirs = "=7.0.0"
toml_edit = "=0.25.17"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

