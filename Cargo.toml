[package]
name = "nine-up"
version = "0.1.0"
edition = "2024"
description = "Update many git repositories at once"
homepage = "https://github.com/siutsin/9up"
repository = "https://github.com/siutsin/9up"
license = "MIT"

[[bin]]
name = "9up"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
glob = "=0.3.4"
toml_edit = "=0.25.17"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

