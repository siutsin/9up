name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Both OSes always report: one failing must not cancel the other's result.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run the tests
        run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          install_args: "aqua:taiki-e/cargo-llvm-cov"

      - name: Check the coverage
        run: mise run coverage

  branch-coverage:
    runs-on: ubuntu-latest

    # Report only: branch coverage needs a nightly toolchain, and a nightly
    # wobble must never fail a pull request. It runs on every change on
    # purpose, so the table sits on the run whose code it measures.
    continue-on-error: true

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --component llvm-tools

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          install_args: "aqua:taiki-e/cargo-llvm-cov"

      - name: Report the branch coverage
        run: |
          {
            echo '## Branch coverage (nightly, report only)'
            echo '```'
            cargo +nightly llvm-cov --locked --branch --ignore-filename-regex 'tests\.rs$' --summary-only || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
