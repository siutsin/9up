name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Both OSes always report: one failing must not cancel the other's result.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run the tests
        run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: "aqua:taiki-e/cargo-llvm-cov"

      - name: Check the coverage
        run: mise run coverage

  formula:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: "aqua:axodotdev/cargo-dist@0.33.1"

      - name: Generate the formula and add its test block
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          formula=$(sed -n 's/^formula = "\(.*\)"$/\1/p' dist-workspace.toml)
          mise exec aqua:axodotdev/cargo-dist@0.33.1 -- dist build --tag="v$version" --artifacts=global
          scripts/formula-test-block.sh "target/distrib/$formula.rb"

      - name: Check the formula
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          formula=$(sed -n 's/^formula = "\(.*\)"$/\1/p' dist-workspace.toml)
          tap_dir="$(brew --repository)/Library/Taps/local/homebrew-check"
          mkdir -p "$tap_dir/Formula"
          cp "target/distrib/$formula.rb" "$tap_dir/Formula/"
          chmod 644 "$tap_dir/Formula/$formula.rb"
          cd "$tap_dir"
          brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/$formula.rb"
          brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict "Formula/$formula.rb"
          brew trust local/check
          brew info "local/check/$formula" > /dev/null

  branch-coverage:
    runs-on: ubuntu-latest

    # Report only: branch coverage needs a nightly toolchain, and a nightly
    # wobble must never fail a pull request. It runs on every change on
    # purpose, so the table sits on the run whose code it measures.
    continue-on-error: true

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --component llvm-tools

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install_args: "aqua:taiki-e/cargo-llvm-cov"

      - name: Report the branch coverage
        run: |
          {
            echo '## Branch coverage (nightly, report only)'
            echo '```'
            cargo +nightly llvm-cov --locked --branch --ignore-filename-regex 'tests\.rs$' --summary-only || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
