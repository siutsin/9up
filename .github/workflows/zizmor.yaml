name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - "**"
    paths:
      - '.github/workflows/**'

jobs:
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          install_args: "aqua:zizmorcore/zizmor"

      - name: Run zizmor
        run: mise exec -- zizmor --format plain .github/workflows

      - name: Generate the SARIF report
        if: always()
        run: mise exec -- zizmor --format sarif .github/workflows > results.sarif

      - name: Upload the SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-results
          path: results.sarif
          retention-days: 14
