[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
# release.yaml started as generated output and is now kept by hand;
# allow-dirty records that it is expected to differ from the generated file.
allow-dirty = ["ci"]
ci = "github"
installers = ["homebrew"]
tap = "siutsin/homebrew-tap"
# A Homebrew class name cannot start with a digit, so the formula is not "9up".
formula = "gau-up"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
