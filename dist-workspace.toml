[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
# release.yml carries one local line: environment: deployment on the publish
# job, so it can read the tap token from that environment. allow-dirty
# records that the file is expected to differ from the generated output.
allow-dirty = ["ci"]
ci = "github"
installers = ["homebrew"]
tap = "siutsin/homebrew-tap"
# The formula takes the binary's name, not the package's (nine-up).
formula = "9up"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
